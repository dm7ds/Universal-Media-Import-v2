name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    # Only build releases on the public repo. The dev repo also has this
    # workflow file in the mirror snapshot, but tags pushed inside dev
    # should not produce releases.
    if: github.repository == 'dm7ds/Universal-Media-Import-v2'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ExifTool is a runtime dependency of UMI but lives outside this repo
      # (Perl-based tool, ~30 MB). Pulled fresh on every release run.
      #
      # KEINE Versions-Auflösung mehr. Jede Variante davon ist uns schon auf die
      # Füße gefallen: eine gepinnte Version brach, sobald exiftool.org die alte
      # Datei entfernte (13.05, 13.58), und die Auflösung über ver.txt brach bei
      # v2.2.1, weil exiftool.org seine Windows-ZIPs komplett nach SourceForge
      # verlagert hat — ver.txt meldete korrekt 13.59, die exiftool.org-URL gab
      # 404.
      #
      # SourceForge liefert unter /files/latest/download direkt die aktuelle
      # Windows-64-Bit-ZIP (verifiziert: Redirect auf exiftool-13.59_64.zip,
      # content-disposition attachment). Damit gibt es keine Versionsnummer im
      # Workflow, die veralten kann. Der Sanity-Check unten faengt ab, falls
      # SourceForge je etwas anderes als die Windows-ZIP ausliefert.
      - name: Download ExifTool
        shell: pwsh
        run: |
          $zipUrl  = 'https://sourceforge.net/projects/exiftool/files/latest/download'
          $zipPath = Join-Path $env:RUNNER_TEMP 'exiftool.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'exiftool-extract'

          # Der User-Agent ist NICHT optional: SourceForge wertet ihn aus und
          # liefert Clients, deren UA "PowerShell/<x>" enthaelt, eine HTML-Seite
          # statt des Redirects auf die ZIP. Genau diesen UA setzt
          # Invoke-WebRequest per Default — lokal gegengeprueft mit pwsh 7:
          # Default-UA => 146 KB HTML (beginnt mit "<!do"), UA=Wget/curl =>
          # 11,2 MB mit korrekter PK-Signatur. Ohne Override wuerde der Build
          # also erneut brechen, nur mit kryptischem Expand-Archive-Fehler.
          $ua = 'Wget/1.21.3'

          Write-Host "Downloading ExifTool (latest) from $zipUrl"
          Invoke-WebRequest $zipUrl -OutFile $zipPath -UseBasicParsing -UserAgent $ua

          # Frueh und mit klarer Meldung scheitern, falls trotzdem kein ZIP
          # ankommt (UA-Sniffing ist undokumentiert und kann sich aendern).
          # Expand-Archive wuerde hier sonst nur "not a valid archive" werfen.
          $sig = [System.IO.File]::ReadAllBytes($zipPath)[0..1]
          if ($sig[0] -ne 0x50 -or $sig[1] -ne 0x4B) {
            $head = (Get-Content $zipPath -TotalCount 1 -ErrorAction SilentlyContinue)
            throw "ExifTool-Download ist kein ZIP (Signatur $($sig[0].ToString('X2')) $($sig[1].ToString('X2')), erste Zeile: '$head'). SourceForge hat vermutlich eine HTML-Seite geliefert — User-Agent-Handling pruefen."
          }

          Expand-Archive $zipPath -DestinationPath $extract -Force

          # The zip may or may not wrap everything in a top-level directory
          # (varies between releases). If it does, flatten one level.
          $items = Get-ChildItem $extract
          if ($items.Count -eq 1 -and $items[0].PSIsContainer) {
            $source = $items[0].FullName
          } else {
            $source = $extract
          }

          New-Item -ItemType Directory -Path tools/exiftool -Force | Out-Null
          Copy-Item -Recurse -Force "$source/*" tools/exiftool/

          # Standalone build ships exiftool(-k).exe; UMI invokes plain exiftool.exe.
          if (Test-Path 'tools/exiftool/exiftool(-k).exe') {
            Move-Item -Force 'tools/exiftool/exiftool(-k).exe' 'tools/exiftool/exiftool.exe'
          }
          # Sanity check
          if (-not (Test-Path 'tools/exiftool/exiftool.exe')) {
            throw "exiftool.exe not found after extraction. Layout: $(Get-ChildItem tools/exiftool | Select-Object -ExpandProperty Name)"
          }

      - name: Build Gate (0-tolerance for warnings)
        run: dotnet build src/UMI.CLI/UMI.CLI.csproj -c Release -p:TreatWarningsAsErrors=true

      # ── Slim Build ──
      - name: Publish Slim
        run: pwsh -File build.ps1 -Publish slim

      - name: Zip Slim
        run: Compress-Archive -Path publish\* -DestinationPath umi-slim.zip

      # ── Portable Build ──
      - name: Publish Portable
        run: pwsh -File build.ps1 -Publish portable

      - name: Zip Portable
        run: Compress-Archive -Path publish\* -DestinationPath umi-portable.zip

      # ── Installer Build ──
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Installer
        run: pwsh -File build.ps1 -Publish slim -Gui -Installer

      # ── Code signing via SignPath Foundation (free OSS programme) ──
      # The block below stays dormant until SignPath has approved the project.
      # After approval set the following on the public repo:
      #
      #   Repository variables (Settings → Secrets and variables → Actions → Variables):
      #     SIGNPATH_ENABLED        = true
      #     SIGNPATH_ORG_ID         = <org id from SignPath dashboard>
      #     SIGNPATH_PROJECT_SLUG   = umi
      #     SIGNPATH_POLICY_SLUG    = release-signing
      #
      #   Repository secret (Settings → Secrets and variables → Actions → Secrets):
      #     SIGNPATH_API_TOKEN      = <CI user's API token>
      #
      # Until SIGNPATH_ENABLED == 'true', the installer ships unsigned but the
      # rest of the workflow keeps working unchanged.
      - name: Upload installer for signing
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        id: upload-unsigned-installer
        uses: actions/upload-artifact@v4
        with:
          name: umi-installer-unsigned
          path: installer/Output/UMI_Setup_*.exe

      - name: Submit installer to SignPath
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: installer/Output/signed

      - name: Replace unsigned installer with signed
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        shell: pwsh
        run: |
          Get-ChildItem installer/Output/signed/UMI_Setup_*.exe | ForEach-Object {
            Move-Item -Force $_.FullName "installer/Output/$($_.Name)"
          }
          Remove-Item -Recurse -Force installer/Output/signed

      # ── GitHub Release ──
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            umi-slim.zip
            umi-portable.zip
            installer/Output/UMI_Setup_*.exe
