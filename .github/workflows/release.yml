name: Release

on:
  # Release: nur ein Tag-Push "v*" legt ein GitHub-Release an.
  push:
    tags:
      - 'v*'
  # Probelauf: baut und testet alles (inkl. Installer), veroeffentlicht aber
  # NICHTS. Ob veroeffentlicht wird, haengt allein am Event (siehe PUBLISH im
  # Job-env), nie an diesem Eingang — er ist nur die ausdrueckliche Bestaetigung
  # "das ist ein Probelauf"; false wird im Step "Modus festlegen" abgelehnt.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Probelauf: bauen + testen, KEIN Release, nichts wird veroeffentlicht'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    timeout-minutes: 30
    # Tag-Pushes bauen nur im oeffentlichen Repo. Das Dev-Repo hat diese
    # Workflow-Datei ebenfalls (Mirror-Snapshot); dort sollen Tags kein Release
    # erzeugen. Der manuelle Probelauf darf in beiden Repos laufen, weil er
    # nichts veroeffentlicht.
    if: github.event_name == 'workflow_dispatch' || github.repository == 'dm7ds/Universal-Media-Import-v2'

    env:
      # DIE eine Stelle, die ueber Veroeffentlichung entscheidet. Jeder Step, der
      # etwas hochlaedt, an einen Dienst schickt oder ein Release anlegt, prueft
      # `env.PUBLISH == 'true'`. Beim Probelauf ist das Event workflow_dispatch,
      # PUBLISH also 'false' — unabhaengig davon, welche Ref oder welcher Eingang
      # gewaehlt wurde (auch ein Dispatch auf einem Tag veroeffentlicht nicht).
      #
      # Das Tag-Muster 'v*' steht NUR im on.push.tags-Filter oben; mit nur einem
      # tags-Filter loest ein Branch-Push diesen Workflow gar nicht aus. Hier
      # steht bewusst nur `ref_type == 'tag'` (kein zweites Muster): faengt ab,
      # dass jemand spaeter einen branches-Filter unter on.push ergaenzt und damit
      # Branch-Pushes veroeffentlichen wuerden.
      PUBLISH: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}

    steps:
      - name: Modus festlegen
        shell: pwsh
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:DRY_RUN -ne 'true') {
            throw "workflow_dispatch ist nur als Probelauf erlaubt (dry_run=true). Ein Release entsteht ausschliesslich durch einen Tag-Push v*."
          }
          if ($env:PUBLISH -eq 'true') {
            Write-Host "Modus: RELEASE ($env:GITHUB_REF_NAME) — baut, testet und veroeffentlicht."
          } else {
            Write-Host "Modus: PROBELAUF ($env:GITHUB_EVENT_NAME, $env:GITHUB_REF) — baut und testet, veroeffentlicht nichts."
          }

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Kein Token in .git/config zuruecklassen: Build- und Installer-Skripte
          # brauchen keinen Schreibzugriff aufs Repo. Das Release-Step bringt sein
          # eigenes Token mit.
          persist-credentials: false

      # tests/UMI.Core.Tests zielt auf net10.0, die Produktprojekte auf net8.0.
      # Beide SDKs explizit installieren, damit der Testlauf nicht davon abhaengt,
      # was das Runner-Image zufaellig vorinstalliert hat.
      - name: Setup .NET 8 + 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # ── Test-Gate ──
      # Kein Release ohne gruene Tests: schlaegt ein Test fehl, bricht dieser Step
      # den Job ab; alle folgenden Steps (Installer, Release) laufen nur bei
      # success() und werden uebersprungen.
      - name: Unit Tests (UMI.Core.Tests)
        run: dotnet test tests/UMI.Core.Tests/UMI.Core.Tests.csproj -c Release --nologo

      # ExifTool is a runtime dependency of UMI but lives outside this repo
      # (Perl-based tool, ~30 MB). Pulled fresh on every release run.
      #
      # KEINE Versions-Auflösung mehr. Jede Variante davon ist uns schon auf die
      # Füße gefallen: eine gepinnte Version brach, sobald exiftool.org die alte
      # Datei entfernte (13.05, 13.58), und die Auflösung über ver.txt brach bei
      # v2.2.1, weil exiftool.org seine Windows-ZIPs komplett nach SourceForge
      # verlagert hat — ver.txt meldete korrekt 13.59, die exiftool.org-URL gab
      # 404.
      #
      # SourceForge liefert unter /files/latest/download direkt die aktuelle
      # Windows-64-Bit-ZIP (verifiziert: Redirect auf exiftool-13.59_64.zip,
      # content-disposition attachment). Damit gibt es keine Versionsnummer im
      # Workflow, die veralten kann. Der Sanity-Check unten faengt ab, falls
      # SourceForge je etwas anderes als die Windows-ZIP ausliefert.
      #
      # Integritaet: der Herausgeber (exiftool.org) veroeffentlicht die SHA256
      # der Distributionsdateien unter /checksums.txt (aktuelle Version; pro
      # Version zusaetzlich /checksums-<ver>.txt). Das ist eine ANDERE Quelle als
      # der Download (SourceForge). Der Step berechnet den SHA256 der geladenen
      # ZIP selbst und bricht bei Abweichung ab — auch wenn checksums.txt nicht
      # erreichbar ist oder keinen eindeutigen _64.zip-Eintrag hat (fail closed).
      # Hinweis: Erscheint zwischen den beiden Abrufen eine neue ExifTool-Version
      # und die beiden Quellen sind kurz uneins, scheitert der Step bewusst;
      # ein Neustart des Laufs loest das.
      - name: Download ExifTool
        shell: pwsh
        run: |
          $zipUrl  = 'https://sourceforge.net/projects/exiftool/files/latest/download'
          $sumsUrl = 'https://exiftool.org/checksums.txt'
          $zipPath = Join-Path $env:RUNNER_TEMP 'exiftool.zip'
          $sumsPath = Join-Path $env:RUNNER_TEMP 'exiftool-checksums.txt'
          $extract = Join-Path $env:RUNNER_TEMP 'exiftool-extract'

          # Der User-Agent ist NICHT optional: SourceForge wertet ihn aus und
          # liefert Clients, deren UA "PowerShell/<x>" enthaelt, eine HTML-Seite
          # statt des Redirects auf die ZIP. Genau diesen UA setzt
          # Invoke-WebRequest per Default — lokal gegengeprueft mit pwsh 7:
          # Default-UA => 146 KB HTML (beginnt mit "<!do"), UA=Wget/curl =>
          # 11,2 MB mit korrekter PK-Signatur. Ohne Override wuerde der Build
          # also erneut brechen, nur mit kryptischem Expand-Archive-Fehler.
          $ua = 'Wget/1.21.3'

          # Erst den Pruefwert des Herausgebers holen (andere Quelle als die ZIP).
          Write-Host "Fetching publisher checksums from $sumsUrl"
          Invoke-WebRequest $sumsUrl -OutFile $sumsPath -UseBasicParsing -UserAgent $ua
          $entries = [regex]::Matches((Get-Content $sumsPath -Raw), '(?m)^SHA2-256\((exiftool-[0-9.]+_64\.zip)\)=\s*([0-9a-fA-F]{64})\s*$')
          if ($entries.Count -ne 1) {
            throw "checksums.txt von exiftool.org enthaelt $($entries.Count) SHA2-256-Eintraege fuer exiftool-<ver>_64.zip (erwartet: genau 1). Format geaendert? Erste Zeilen: $((Get-Content $sumsPath -TotalCount 3) -join ' | ')"
          }
          $expectedName = $entries[0].Groups[1].Value
          $expectedHash = $entries[0].Groups[2].Value
          Write-Host "Publisher SHA256 for ${expectedName}: $expectedHash"

          Write-Host "Downloading ExifTool (latest) from $zipUrl"
          Invoke-WebRequest $zipUrl -OutFile $zipPath -UseBasicParsing -UserAgent $ua

          # Frueh und mit klarer Meldung scheitern, falls trotzdem kein ZIP
          # ankommt (UA-Sniffing ist undokumentiert und kann sich aendern).
          # Expand-Archive wuerde hier sonst nur "not a valid archive" werfen.
          $sig = [System.IO.File]::ReadAllBytes($zipPath)[0..1]
          if ($sig[0] -ne 0x50 -or $sig[1] -ne 0x4B) {
            $head = (Get-Content $zipPath -TotalCount 1 -ErrorAction SilentlyContinue)
            throw "ExifTool-Download ist kein ZIP (Signatur $($sig[0].ToString('X2')) $($sig[1].ToString('X2')), erste Zeile: '$head'). SourceForge hat vermutlich eine HTML-Seite geliefert — User-Agent-Handling pruefen."
          }

          # Integritaet: selbst berechneter SHA256 gegen den Herausgeber-Wert.
          # (-ne ist in PowerShell case-insensitive; Get-FileHash liefert Grossbuchstaben.)
          $actualHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
            throw "ExifTool-ZIP SHA256 weicht vom Wert des Herausgebers ab. Erwartet ($expectedName, exiftool.org): $expectedHash — berechnet: $actualHash. Manipulierter Download oder neue Version zwischen den Abrufen (Lauf wiederholen)."
          }
          Write-Host "ExifTool SHA256 verified ($expectedName)"

          Expand-Archive $zipPath -DestinationPath $extract -Force

          # The zip may or may not wrap everything in a top-level directory
          # (varies between releases). If it does, flatten one level.
          $items = Get-ChildItem $extract
          if ($items.Count -eq 1 -and $items[0].PSIsContainer) {
            $source = $items[0].FullName
          } else {
            $source = $extract
          }

          New-Item -ItemType Directory -Path tools/exiftool -Force | Out-Null
          Copy-Item -Recurse -Force "$source/*" tools/exiftool/

          # Standalone build ships exiftool(-k).exe; UMI invokes plain exiftool.exe.
          if (Test-Path 'tools/exiftool/exiftool(-k).exe') {
            Move-Item -Force 'tools/exiftool/exiftool(-k).exe' 'tools/exiftool/exiftool.exe'
          }
          # Sanity check
          if (-not (Test-Path 'tools/exiftool/exiftool.exe')) {
            throw "exiftool.exe not found after extraction. Layout: $(Get-ChildItem tools/exiftool | Select-Object -ExpandProperty Name)"
          }

      - name: Build Gate (0-tolerance for warnings)
        run: dotnet build src/UMI.CLI/UMI.CLI.csproj -c Release -p:TreatWarningsAsErrors=true

      # ── Slim Build ──
      - name: Publish Slim
        run: pwsh -File build.ps1 -Publish slim

      - name: Zip Slim
        run: Compress-Archive -Path publish\* -DestinationPath umi-slim.zip

      # ── Portable Build ──
      - name: Publish Portable
        run: pwsh -File build.ps1 -Publish portable

      - name: Zip Portable
        run: Compress-Archive -Path publish\* -DestinationPath umi-portable.zip

      # ── Installer Build ──
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Installer
        run: pwsh -File build.ps1 -Publish slim -Gui -Installer

      # ── Code signing via SignPath Foundation (free OSS programme) ──
      # The block below stays dormant until SignPath has approved the project.
      # After approval set the following on the public repo:
      #
      #   Repository variables (Settings → Secrets and variables → Actions → Variables):
      #     SIGNPATH_ENABLED        = true
      #     SIGNPATH_ORG_ID         = <org id from SignPath dashboard>
      #     SIGNPATH_PROJECT_SLUG   = umi
      #     SIGNPATH_POLICY_SLUG    = release-signing
      #
      #   Repository secret (Settings → Secrets and variables → Actions → Secrets):
      #     SIGNPATH_API_TOKEN      = <CI user's API token>
      #
      # Until SIGNPATH_ENABLED == 'true', the installer ships unsigned but the
      # rest of the workflow keeps working unchanged.
      #
      # Alle drei Steps laufen ausserdem nur bei PUBLISH: ein Probelauf laedt
      # keinen Installer hoch und schickt nichts an SignPath.
      - name: Upload installer for signing
        if: env.PUBLISH == 'true' && vars.SIGNPATH_ENABLED == 'true'
        id: upload-unsigned-installer
        uses: actions/upload-artifact@v7
        with:
          name: umi-installer-unsigned
          path: installer/Output/UMI_Setup_*.exe

      - name: Submit installer to SignPath
        if: env.PUBLISH == 'true' && vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: installer/Output/signed

      - name: Replace unsigned installer with signed
        if: env.PUBLISH == 'true' && vars.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          Get-ChildItem installer/Output/signed/UMI_Setup_*.exe | ForEach-Object {
            Move-Item -Force $_.FullName "installer/Output/$($_.Name)"
          }
          Remove-Item -Recurse -Force installer/Output/signed

      # ── GitHub Release ──
      # Einziger Step, der ein Release anlegt. Nur bei Tag-Push (PUBLISH).
      - name: Create GitHub Release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          # Default ist false (action.yml): ein Glob ohne Treffer, z. B. der
          # Installer, ergaebe sonst still ein Release ohne dieses Asset.
          fail_on_unmatched_files: true
          files: |
            umi-slim.zip
            umi-portable.zip
            installer/Output/UMI_Setup_*.exe
